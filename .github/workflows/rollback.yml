name: Manual rollback to retained release artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful release workflow run ID containing sample-api artifact (within retention period)'
        required: true
        type: string
      target:
        description: 'Environment to roll back'
        required: true
        type: choice
        options: [dev, qa, prod]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Download previous release artifact
        uses: actions/download-artifact@v4
        with:
          name: sample-api
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: publish/
      - name: Validate target configuration
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          APP: ${{ vars.APP_NAME }}
        run: |
          for v in CLIENT TENANT SUBSCRIPTION APP; do
            test -n "${!v}" || { echo "::error::Missing $v for target environment"; exit 1; }
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Redeploy previous build without rebuilding
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          package: publish/
      - name: Smoke test after rollback
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || exit 1
          curl --fail --retry 5 --retry-delay 5 "${APP_URL%/}/health"
