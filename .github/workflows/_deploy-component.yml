name: _deploy-component

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      environment:
        type: string
        required: true
      kind:
        type: string
        required: true
      artifact:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.component }}-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: artifact

      - name: Azure deployment not configured
        if: vars.AZURE_CLIENT_ID == ''
        run: |
          echo "::notice::Azure deploy skipped: AZURE_CLIENT_ID not configured in GitHub environment."

      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web App
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'webapp'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          package: artifact

      - name: Deploy Function App
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'functionapp'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.APP_NAME }}
          package: artifact

      - name: Deploy Static Web App
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'staticwebapp'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifact
          skip_app_build: true

      - name: Bicep what-if
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'bicep'
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          STAGE: ${{ inputs.environment }}
        run: |
          az deployment group what-if --resource-group "$RG" --template-file artifact/main.bicep --parameters "artifact/main.parameters.$STAGE.json" > bicep-whatif.txt
          cat bicep-whatif.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bicep what-if
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'bicep'
        uses: actions/upload-artifact@v4
        with:
          name: bicep-whatif-${{ inputs.environment }}-${{ github.sha }}
          path: bicep-whatif.txt
          retention-days: 90

      - name: Deploy Bicep
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'bicep'
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          STAGE: ${{ inputs.environment }}
        run: |
          az deployment group create --resource-group "$RG" --template-file artifact/main.bicep --parameters "artifact/main.parameters.$STAGE.json"

      - name: Post-deploy smoke test
        if: vars.AZURE_CLIENT_ID != '' && inputs.kind == 'webapp' && vars.SDMS_SMOKE_BASE_URL != ''
        env:
          BASE_URL: ${{ vars.SDMS_SMOKE_BASE_URL }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "${BASE_URL%/}/health"
